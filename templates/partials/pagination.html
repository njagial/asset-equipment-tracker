<nav class="d-flex justify-content-between align-items-center my-2" aria-label="Page navigation">
    <span class="text-muted small">{{ result_count }} result{{ result_count|pluralize }}</span>
    <ul class="pagination pagination-sm mb-0">
        <li class="page-item {% if not page_obj.has_previous %}disabled{% endif %}">
            <a class="page-link" href="{% if page_obj.has_previous %}{% querystring page=page_obj.previous_page_number %}{% endif %}">‹ Prev</a>
        </li>
        <li class="page-item disabled"><span class="page-link">Page {{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span></li>
        <li class="page-item {% if not page_obj.has_next %}disabled{% endif %}">
            <a class="page-link" href="{% if page_obj.has_next %}{% querystring page=page_obj.next_page_number %}{% endif %}">Next ›</a>
        </li>
    </ul>
</nav>
