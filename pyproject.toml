[project]
name = "asset-tracker"
version = "0.1.0"
description = "Asset & Equipment Tracking System - Django/DRF/HTMX + PostgreSQL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6.0",
    "djangorestframework>=3.16,<4.0",
    "django-filter>=25.1",
    "psycopg[binary]>=3.2",
    "celery[redis]>=5.5,<6.0",
    "django-celery-beat>=2.8",
    "django-celery-results>=2.6",
    "python-dotenv>=1.1",
    "gunicorn>=23.0",
    "whitenoise>=6.9",
    "python-barcode>=0.15,<0.16",
    "qrcode[pil]>=8.0",
    "pillow>=11.0",
    "dj-database-url>=3.1.2",
]

[dependency-groups]
dev = [
    "ruff>=0.12",
    "pytest>=8.0",
    "pytest-django>=4.11",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "RUF012",  # Django-idiomatic mutable class attrs (Meta, ModelAdmin, DRF fields)
    "BLE001",  # notification channels must never crash the celery task
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
